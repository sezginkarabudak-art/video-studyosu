name: Video Studyosu Regression Tests
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow edge-tts imageio-ffmpeg deep-translator
      - name: Compile application
        run: python -m py_compile Video_Studyosu_V5_Arayuz_Onizleme.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

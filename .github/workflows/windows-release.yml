name: Video Studyosu Windows Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow edge-tts imageio-ffmpeg deep-translator pyinstaller
      - name: Verify source
        run: |
          if (!(Test-Path "Video_Studyosu_V5_Arayuz_Onizleme.py")) { throw "Ana program dosyasi depoda yok: Video_Studyosu_V5_Arayuz_Onizleme.py" }
      - name: Build Windows app
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Video Studyosu" --distpath dist --workpath build --specpath build --collect-all edge_tts --collect-all imageio_ffmpeg --hidden-import deep_translator --hidden-import PIL.ImageTk Video_Studyosu_V5_Arayuz_Onizleme.py
      - name: Package updater
        shell: pwsh
        run: |
          Compress-Archive -Force -Path 'dist/Video Studyosu.exe','update_install.bat' -DestinationPath 'VideoStudyosu_Update.zip'
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Video Studyosu ${{ github.ref_name }}
          generate_release_notes: true
          files: VideoStudyosu_Update.zip
